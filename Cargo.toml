[package]
name = "fraicheur"
version = "0.1.0"
edition = "2021"
description = "TUI pour indexer et sauter dans ses projets de travail"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
shellexpand = "3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
